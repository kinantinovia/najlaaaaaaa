<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimarket ABP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="container">
        <h1>
            <marquee>SELAMAT DATANG DI MINIMARKET ABP</marquee>
        </h1>
       
    </header>

    <main>
        <section id="product-list">
            <h2>PILIH BARANGMU</h2>
            <div id="product" class="products-container"></div>
        </section>

        <section id="cart">
            <h2>Keranjang Belanja</h2>
            <ul id="cart-items"></ul>

            <p class="total">
                Total: Rp <span id="total-price">0</span>
            </p>

            <button id="checkout-btn">Checkout</button>
            <button id="clear-cart-btn" class="clear-btn">
                Kosongkan Keranjang
            </button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Minimarket ABP</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
